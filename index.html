<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FBF8F2">
<title>Антон и Елизавета — 30 августа 2026</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
 :root{
 --cobalt: #8A8264;
 --cobalt-deep: #4A4636;
 --ochre: #B79A5D;
 --terracotta: #A98F72;
 --plaster: #FBF8F2;
 --deep-cream: #E9DFC7;
 --olive: #8C9A7B;
 --ink: #3A362E;
 }
 *{box-sizing:border-box; margin:0; padding:0;}
 html{
 scroll-behavior:smooth;
 background:#FBF8F2;
 color-scheme: light only;
 }
 body{
 background:var(--plaster);
 color:var(--ink);
 font-family:'Jost', sans-serif;
 font-weight:400;
 overflow-x:hidden;
 font-size: 1.4rem;
 }
 h1,h2,h3, .display{
 font-family:'Playfair Display', serif;
 font-weight:600;
 letter-spacing:0.02em;
 }
 .eyebrow{
 font-family:'Jost',sans-serif;
 text-transform:uppercase;
 letter-spacing:0.35em;
 font-size:1rem;
 color:var(--cobalt);
 opacity:0.85;
 font-weight: 500;
 }
 .tile-row{
 display:flex;
 width:100%;
 height:14px;
 }
 .tile-row span{
 flex:1;
 height:100%;
 }
 .tile-row span:nth-child(4n+1){background:var(--cobalt);}
 .tile-row span:nth-child(4n+2){background:var(--ochre);}
 .tile-row span:nth-child(4n+3){background:var(--terracotta);}
 .tile-row span:nth-child(4n+4){background:var(--olive);}
 section{
 padding:4rem 2rem;
 position:relative;
 }
 .wrap{
 max-width:800px;
 margin:0 auto;
 }
 .hero{
 min-height:85svh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:
 radial-gradient(circle at 20% 20%, rgba(138,130,100,0.10), transparent 55%),
 radial-gradient(circle at 80% 75%, rgba(183,154,93,0.14), transparent 55%),
 var(--plaster);
 padding:3rem 2rem;
 }
 .hero .eyebrow{
 opacity:0;
 animation: fadeUp 0.9s ease forwards;
 animation-delay:0.1s;
 }
 .hero h1{
 font-size:clamp(3.2rem, 11vw, 6rem);
 line-height:1.1;
 margin:1rem 0 0.5rem;
 color:var(--cobalt-deep);
 opacity:0;
 animation: fadeUp 1s ease forwards;
 animation-delay:0.3s;
 }
 .hero .amp{
 display:inline-block;
 color:var(--terracotta);
 font-style:italic;
 padding:0 0.15em;
 }
 .hero .date-line{
 font-size:1.5rem;
 letter-spacing:0.25em;
 text-transform:uppercase;
 color:var(--terracotta);
 margin-top:0.8rem;
 font-weight: 500;
 opacity:0;
 animation: fadeUp 1s ease forwards;
 animation-delay:0.55s;
 }
 .hero .heart{
 margin-top:1.5rem;
 opacity:0;
 animation: fadeUp 1s ease forwards, pulse 3.2s ease-in-out 1.6s infinite;
 animation-delay:0.8s;
 }
 @keyframes fadeUp{
 from{opacity:0; transform:translateY(18px);}
 to{opacity:1; transform:translateY(0);}
 }
 @keyframes pulse{
 0%,100%{ transform:scale(1); opacity:0.85;}
 50%{ transform:scale(1.08); opacity:1;}
 }
 .scroll-cue{
 position:absolute;
 bottom:1.5rem;
 left:50%;
 transform:translateX(-50%);
 width:1px;
 height:38px;
 background:var(--cobalt);
 opacity:0.4;
 }
 .scroll-cue::after{
 content:'';
 position:absolute;
 top:0; left:50%;
 width:6px; height:6px;
 background:var(--terracotta);
 border-radius:50%;
 transform:translateX(-50%);
 animation: dropCue 2.2s ease-in-out infinite;
 }
 @keyframes dropCue{
 0%{top:0; opacity:1;}
 80%{top:34px; opacity:0;}
 100%{top:34px; opacity:0;}
 }
 .reveal{
 opacity:0;
 transform:translateY(24px);
 transition: opacity 0.8s ease, transform 0.8s ease;
 }
 .reveal.in{
 opacity:1;
 transform:translateY(0);
 }
 .welcome{ text-align:center; }
 .welcome p{
 font-size:1.4rem;
 line-height:1.7;
 color:var(--ink);
 max-width:650px;
 margin:1.5rem auto 0;
 }
 .welcome .display{
 font-size:2.4rem;
 color:var(--cobalt-deep);
 font-weight: 400;
 line-height: 1.3;
 }
 .calendar{
 background:var(--deep-cream);
 color:var(--ink);
 text-align:center;
 }
 .calendar .eyebrow{color:var(--terracotta); opacity:0.9;}
 .cal-box{
 max-width:420px;
 margin:2.5rem auto 0;
 background:rgba(58,54,46,0.04);
 border:1px solid rgba(58,54,46,0.15);
 border-radius:6px;
 overflow:hidden;
 }
 .cal-head{
 background:var(--terracotta);
 color:var(--plaster);
 padding:1rem;
 text-transform:uppercase;
 letter-spacing:0.2em;
 font-size:1.1rem;
 font-weight: 500;
 }
 .cal-grid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:10px;
 padding:1.5rem;
 }
 .cal-grid .dow{
 font-size:0.9rem;
 opacity:0.7;
 text-transform:uppercase;
 font-weight: 500;
 }
 .cal-grid .day{
 font-family:'Playfair Display', serif;
 font-size:1.4rem;
 padding:0.5rem 0;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 }
 .cal-grid .day.marked{
 color:var(--ochre);
 font-weight:600;
 }
 .cal-grid .day.marked::after{
 content:'\2661';
 position:absolute;
 width: 44px;
 height: 44px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:2.8rem;
 color:transparent;
 -webkit-text-stroke:1.5px var(--ochre);
 opacity:0.95;
 pointer-events: none;
 z-index: 1;
 }
 .countdown{
 margin-top:2.8rem;
 display:flex;
 justify-content:center;
 gap:2rem;
 flex-wrap:wrap;
 }
 .countdown div{ text-align:center; }
 .countdown .num{
 font-family:'Playfair Display', serif;
 font-size:3.6rem;
 color:var(--ochre);
 line-height:1;
 font-weight: 600;
 }
 .countdown .lbl{
 font-size:0.85rem;
 text-transform:uppercase;
 letter-spacing:0.2em;
 opacity:0.8;
 margin-top: 0.3rem;
 }
 .venue{ text-align:center; }
 .venue-card{
 margin-top:2rem;
 padding:3rem 2rem;
 background:#fff;
 border:1px solid rgba(138,130,100,0.2);
 border-radius:6px;
 }
 .venue-card h3{ font-size:2.8rem; color:var(--terracotta); margin-bottom: 0.5rem; }
 .venue-card p{ font-size: 1.3rem; margin:0.5rem 0 1.8rem; opacity:0.85; }
 .btn, .submit-btn{
 display:inline-block;
 padding:1.2rem 3rem;
 background:var(--ochre);
 color:var(--ink);
 text-decoration:none;
 letter-spacing:0.15em;
 text-transform:uppercase;
 font-size:0.95rem;
 font-weight: 500;
 border-radius:4px;
 border: none;
 cursor: pointer;
 transition:background 0.3s ease, transform 0.3s ease;
 font-family: 'Jost', sans-serif;
 }
 .btn:hover{ background:#A5895A; transform:translateY(-2px); }
 .timeline{ text-align:center; }
 .timeline h2{ font-size: 2.4rem; color: var(--cobalt-deep); }
 .timeline-note{
 margin-top:2rem;
 padding:2rem;
 border:1px dashed rgba(107,123,79,0.5);
 color:var(--olive);
 font-style:italic;
 font-size: 1.3rem;
 border-radius:6px;
 }
 .dress{ text-align:center; }
 .dress h2{ font-size: 2.4rem; }
 .palette{
 display:flex;
 justify-content:center;
 gap:1.2rem;
 margin:2.5rem 0 1.5rem;
 flex-wrap:wrap;
 }
 .swatch{
 width:68px; height:68px;
 border-radius:50%;
 box-shadow:0 4px 14px rgba(0,0,0,0.12);
 transition:transform 0.3s ease;
 }
 .swatch:hover{ transform:scale(1.12); }
 .rsvp{
 background:var(--deep-cream);
 color:var(--ink);
 }
 .rsvp .eyebrow{ color:var(--terracotta); text-align:center; display:block; }
 .rsvp h2{ text-align:center; font-size: 2.6rem; color: var(--cobalt-deep); margin-bottom: 0.5rem; }
 form{
 margin-top:2.5rem;
 display:flex;
 flex-direction:column;
 gap:1.6rem;
 max-width: 500px;
 margin-left: auto;
 margin-right: auto;
 }
 label{
 font-size:0.9rem;
 text-transform:uppercase;
 letter-spacing:0.15em;
 opacity:0.8;
 margin-bottom:0.5rem;
 display:block;
 font-weight: 500;
 text-align: left;
 }
 input[type=text]{
 width:100%;
 padding:1rem 0.3rem;
 background:transparent;
 border:none;
 border-bottom:1px solid rgba(58,54,46,0.4);
 color:var(--ink);
 font-family:'Jost',sans-serif;
 font-size:1.3rem;
 outline:none;
 transition:border-color 0.3s ease;
 }
 input[type=text]:focus{ border-color:var(--terracotta); }
 input[type=text]::placeholder{ color:rgba(58,54,46,0.35); }
 .radio-group{ display:flex; gap:1.5rem; flex-wrap:wrap; }
 .radio-opt{
 flex:1;
 min-width:180px;
 padding:1.2rem 1rem;
 border:1px solid rgba(58,54,46,0.3);
 border-radius:6px;
 cursor:pointer;
 text-align:center;
 transition:all 0.25s ease;
 font-size:1.1rem;
 font-weight: 400;
 background: rgba(255,255,255,0.15);
 }
 .radio-opt input{ display:none; }
 .radio-opt.selected{
 background:var(--ochre);
 color:var(--cobalt-deep);
 border-color:var(--ochre);
 font-weight:600;
 }
 #partner-field{
 max-height:0;
 overflow:hidden;
 opacity:0;
 transition:max-height 0.4s ease, opacity 0.4s ease, margin 0.4s ease;
 }
 #partner-field.open{
 max-height:120px;
 opacity:1;
 margin-top: 0.5rem;
 }
 .submit-btn{
 margin-top:1.5rem;
 padding:1.3rem;
 background:var(--terracotta);
 color:var(--plaster);
 font-size:1.05rem;
 width: 100%;
 }
 .submit-btn:hover{ background:#8F7658; }
 .thanks{
 display:none;
 text-align:center;
 padding:3rem 2rem;
 border:1px solid rgba(213,164,25,0.4);
 border-radius:6px;
 margin-top:1.5rem;
 background: rgba(255,255,255,0.3);
 }
 .thanks.show{ display:block; animation:fadeUp 0.6s ease; }
 .thanks p { font-size: 1.3rem; margin-top: 0.5rem; }
 footer{
 text-align:center;
 padding:3rem 2rem;
 font-size:0.9rem;
 letter-spacing:0.2em;
 text-transform:uppercase;
 color:var(--cobalt);
 opacity:0.7;
 font-weight: 500;
 }
</style>
</head>
<body>

<section class="hero">
 <div class="eyebrow">Приглашаем на свадьбу</div>
 <h1>Антон<span class="amp">&</span>Елизавета</h1>
 <div class="date-line">30 августа 2026</div>
 <div class="heart">
 <svg width="40" height="36" viewBox="0 0 34 30" fill="none">
 <path d="M17 29C17 29 1 19.5 1 9.5C1 4.5 5 1 9.5 1C13 1 15.5 3 17 6C18.5 3 21 1 24.5 1C29 1 33 4.5 33 9.5C33 19.5 17 29 17 29Z" stroke="#B79A5D" stroke-width="1.4"/>
 </svg>
 </div>
 <div class="scroll-cue"></div>
</section>

<div class="tile-row" aria-hidden="true">
<span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<section class="welcome reveal">
 <div class="wrap">
