<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FBF8F2">
<title>Антон и Елизавета — 30 августа 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cobalt: #8A8264;
    --cobalt-deep: #4A4636;
    --ochre: #B79A5D;
    --terracotta: #A98F72;
    --plaster: #FBF8F2;
    --deep-cream: #E9DFC7;
    --olive: #8C9A7B;
    --ink: #3A362E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{
    scroll-behavior:smooth;
    background:#FBF8F2;
    color-scheme: light only;
  }
  body{
    background:var(--plaster);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:300;
    overflow-x:hidden;
  }
  h1,h2,h3, .display{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    letter-spacing:0.02em;
  }
  .eyebrow{
    font-family:'Jost',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.35em;
    font-size:0.7rem;
    color:var(--cobalt);
    opacity:0.75;
  }

  /* Tile border motif — signature element */
  .tile-row{
    display:flex;
    width:100%;
    height:14px;
  }
  .tile-row span{
    flex:1;
    height:100%;
  }
  .tile-row span:nth-child(4n+1){background:var(--cobalt);}
  .tile-row span:nth-child(4n+2){background:var(--ochre);}
  .tile-row span:nth-child(4n+3){background:var(--terracotta);}
  .tile-row span:nth-child(4n+4){background:var(--olive);}

  section{
    padding:5.5rem 1.5rem;
    position:relative;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
  }

  /* HERO */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(138,130,100,0.10), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(183,154,93,0.14), transparent 55%),
      var(--plaster);
    padding:2rem 1.5rem;
  }
  .hero .eyebrow{
    opacity:0;
    animation: fadeUp 0.9s ease forwards;
    animation-delay:0.1s;
  }
  .hero h1{
    font-size:clamp(2.6rem, 9vw, 5.2rem);
    line-height:1.05;
    margin:0.6rem 0 0.3rem;
    color:var(--cobalt-deep);
    opacity:0;
    animation: fadeUp 1s ease forwards;
    animation-delay:0.3s;
  }
  .hero .amp{
    display:inline-block;
    color:var(--terracotta);
    font-style:italic;
    padding:0 0.15em;
  }
  .hero .date-line{
    font-size:1.1rem;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-top:0.5rem;
    opacity:0;
    animation: fadeUp 1s ease forwards;
    animation-delay:0.55s;
  }
  .hero .heart{
    margin-top:2.2rem;
    opacity:0;
    animation: fadeUp 1s ease forwards, pulse 3.2s ease-in-out 1.6s infinite;
    animation-delay:0.8s;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:0.85;}
    50%{ transform:scale(1.08); opacity:1;}
  }
  .scroll-cue{
    position:absolute;
    bottom:2.2rem;
    left:50%;
    transform:translateX(-50%);
    width:1px;
    height:38px;
    background:var(--cobalt);
    opacity:0.4;
  }
  .scroll-cue::after{
    content:'';
    position:absolute;
    top:0; left:50%;
    width:6px; height:6px;
    background:var(--terracotta);
    border-radius:50%;
    transform:translateX(-50%);
    animation: dropCue 2.2s ease-in-out infinite;
  }
  @keyframes dropCue{
    0%{top:0; opacity:1;}
    80%{top:34px; opacity:0;}
    100%{top:34px; opacity:0;}
  }

  /* reveal-on-scroll */
  .reveal{
    opacity:0;
    transform:translateY(24px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .reveal.in{
    opacity:1;
    transform:translateY(0);
  }

  /* WELCOME */
  .welcome{ text-align:center; }
  .welcome p{
    font-size:1.15rem;
    line-height:1.8;
    color:var(--ink);
    max-width:560px;
    margin:1.2rem auto 0;
  }
  .welcome .display{
    font-size:1.9rem;
    color:var(--cobalt-deep);
  }

  /* CALENDAR */
  .calendar{
    background:var(--deep-cream);
    color:var(--ink);
    text-align:center;
  }
  .calendar .eyebrow{color:var(--terracotta); opacity:0.9;}
  .cal-box{
    max-width:320px;
    margin:2rem auto 0;
    background:rgba(58,54,46,0.04);
    border:1px solid rgba(58,54,46,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .cal-head{
    background:var(--terracotta);
    color:var(--plaster);
    padding:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.2em;
    font-size:0.8rem;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    padding:1.2rem;
  }
  .cal-grid .dow{
    font-size:0.65rem;
    opacity:0.55;
    text-transform:uppercase;
  }
  .cal-grid .day{
    font-family:'Cormorant Garamond', serif;
    font-size:1.05rem;
    padding:0.35rem 0;
    position:relative;
  }
  .cal-grid .day.marked{
    color:var(--ochre);
    font-weight:600;
  }
  .cal-grid .day.marked::after{
    content:'♡';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    color:transparent;
    -webkit-text-stroke:1px var(--ochre);
    opacity:0.9;
  }
  .countdown{
    margin-top:2.4rem;
    display:flex;
    justify-content:center;
    gap:1.4rem;
    flex-wrap:wrap;
  }
  .countdown div{ text-align:center; }
  .countdown .num{
    font-family:'Cormorant Garamond', serif;
    font-size:2.4rem;
    color:var(--ochre);
    line-height:1;
  }
  .countdown .lbl{
    font-size:0.65rem;
    text-transform:uppercase;
    letter-spacing:0.2em;
    opacity:0.7;
  }

  /* VENUE */
  .venue{ text-align:center; }
  .venue-card{
    margin-top:1.8rem;
    padding:2.2rem 1.5rem;
    background:#fff;
    border:1px solid rgba(138,130,100,0.2);
    border-radius:4px;
  }
  .venue-card h3{ font-size:2.1rem; color:var(--terracotta); }
  .venue-card p{ margin:0.4rem 0 1.4rem; opacity:0.75; }
  .btn{
    display:inline-block;
    padding:0.8rem 2rem;
    background:var(--ochre);
    color:var(--ink);
    text-decoration:none;
    letter-spacing:0.12em;
    text-transform:uppercase;
    font-size:0.75rem;
    border-radius:2px;
    transition:background 0.3s ease, transform 0.3s ease;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover{ background:#A5895A; transform:translateY(-2px); }

  /* TIMELINE */
  .timeline{ text-align:center; }
  .timeline-note{
    margin-top:1.5rem;
    padding:1.6rem;
    border:1px dashed rgba(107,123,79,0.5);
    color:var(--olive);
    font-style:italic;
    border-radius:4px;
  }

  /* DRESS CODE */
  .dress{ text-align:center; }
  .palette{
    display:flex;
    justify-content:center;
    gap:0.9rem;
    margin:2rem 0 1.5rem;
    flex-wrap:wrap;
  }
  .swatch{
    width:56px; height:56px;
    border-radius:50%;
    box-shadow:0 4px 14px rgba(0,0,0,0.12);
    transition:transform 0.3s ease;
  }
  .swatch:hover{ transform:scale(1.12); }

  /* RSVP */
  .rsvp{
    background:var(--deep-cream);
    color:var(--ink);
  }
  .rsvp .eyebrow{ color:var(--terracotta); text-align:center; display:block; }
  .rsvp h2{ text-align:center; font-size:2.2rem; color:var(--cobalt-deep); margin-bottom: 0.5rem;}
  form{
    margin-top:2rem;
    display:flex;
    flex-direction:column;
    gap:1.5rem;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    text-align: left;
  }
  .radio-group {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 0.5rem;
    text-align: left;
  }
  .radio-option {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1rem;
    cursor: pointer;
  }
  label{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.15em;
    opacity:0.7;
    margin-bottom:0.35rem;
    display:block;
  }
  input[type=text]{
    width:100%;
    padding:0.8rem 0.2rem;
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(58,54,46,0.3);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-size:1rem;
    outline:none;
    transition:border-color 0.3s ease;
  }
  input[type=text]:focus{ border-color: var(--cobalt); }
</style>
</head>
<body>

  <!-- HERO SECTION (Пример начала структуры страницы) -->
  <section class="hero">
    <div class="eyebrow">Приглашение на свадьбу</div>
    <h1>Антон <span class="amp">&</span> Елизавета</h1>
    <div class="date-line">30 августа 2026</div>
    <div class="heart">♡</div>
    <div class="scroll-cue"></div>
  </section>

  <!-- СЕКЦИЯ RSVP С ФОРМОЙ -->
  <section class="rsvp">
    <div class="wrap">
      <div class="eyebrow">R.S.V.P</div>
      <h2>Подтвердите присутствие</h2>
      
      <form action="https://web3forms.com" method="POST">
        <!-- ВАЖНО: Замените ПОДПИСЬ_НИЖЕ на ваш реальный ключ из Web3Forms Dashboard -->
        <input type="hidden" name="access_key" value="СЮДА_ВСТАВЬТЕ_ВАШ_КЛЮЧ">
        <input type="hidden" name="subject" value="Новый ответ на приглашение (Свадьба)">
        <input type="hidden" name="from_name" value="Свадебный Сайт">

        <!-- Поле: Имя гостя -->
        <div class="form-group">
          <label for="guest-name">Ваше имя и фамилия</label>
          <input type="text" id="guest-name" name="Имя гостя" placeholder="Иван Иванов" required>
        </div>

        <!-- Поле: Присутствие -->
        <div class="form-group">
          <label>Сможете ли вы присутствовать?</label>
          <div class="radio-group">
            <label class="radio-option">
